server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: channels-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/omero_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

jwt:
  secret: ${JWT_SECRET}

meta:
  app-id: ${META_APP_ID:}
  app-secret: ${META_APP_SECRET:}
  es-config-id: ${META_ES_CONFIG_ID:}
  webhook-verify-token: ${META_WEBHOOK_VERIFY_TOKEN:}
  graph-version: ${META_GRAPH_VERSION:v24.0}

token:
  enc-key: ${TOKEN_ENC_KEY:}

internal:
  api-token: ${INTERNAL_API_TOKEN:}

channels:
  env: ${CHANNELS_ENV:dev}

llm:
  inbound-url: ${LLM_INBOUND_URL:http://backend-llm.telemaco-ns.svc.cluster.local:8000/internal/whatsapp/inbound}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://omero.dev,https://www.omero.dev}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
