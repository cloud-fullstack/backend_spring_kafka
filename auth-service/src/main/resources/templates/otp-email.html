<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{SUBJECT}}</title>
  <!--[if mso]>
  <noscript>
    <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f9fafb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%"
         style="background-color:#f9fafb;min-height:100vh;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <table role="presentation" cellspacing="0" cellpadding="0" border="0"
               style="max-width:520px;width:100%;background:#ffffff;border-radius:12px;
                      box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;">

          <tr>
            <td style="background-color:#2563eb;padding:28px 32px;text-align:center;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0"
                     style="margin:0 auto 12px;">
                <tr>
                  <td style="background:#ffffff;border-radius:8px;padding:6px 14px;">
                    <span style="font-size:18px;font-weight:700;color:#2563eb;
                                 letter-spacing:-0.5px;">Telemaco</span>
                  </td>
                </tr>
              </table>
              <span style="display:inline-block;background:rgba(255,255,255,.18);
                           color:#ffffff;font-size:11px;font-weight:600;letter-spacing:1px;
                           text-transform:uppercase;border-radius:999px;
                           padding:4px 12px;">{{BADGE}}</span>
            </td>
          </tr>

          <tr>
            <td style="padding:36px 32px 0;">

              <h1 style="margin:0 0 12px;font-size:22px;font-weight:700;
                          color:#111827;line-height:1.3;">{{HEADING}}</h1>

              <p style="margin:0 0 28px;font-size:15px;color:#4b5563;line-height:1.6;">
                {{INTRO}}
              </p>

              <p style="margin:0 0 8px;font-size:12px;font-weight:600;
                         color:#6b7280;letter-spacing:0.5px;text-transform:uppercase;">
                {{CODE_LABEL}}
              </p>

              <table role="presentation" cellspacing="0" cellpadding="0" border="0"
                     width="100%" style="margin-bottom:12px;">
                <tr>
                  <td align="center"
                      style="background:#eff6ff;border:2px solid #bfdbfe;
                             border-radius:10px;padding:20px 16px;">
                    <span style="font-size:40px;font-weight:800;letter-spacing:10px;
                                 color:#1d4ed8;font-variant-numeric:tabular-nums;
                                 font-family:'Courier New',Courier,monospace;">{{CODE}}</span>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <tr>
            <td style="padding:12px 32px 0;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0"
                     width="100%">
                <tr>
                  <td style="background:#fefce8;border:1px solid #fef08a;border-radius:8px;
                             padding:12px 16px;">
                    <p style="margin:0;font-size:13px;color:#854d0e;line-height:1.5;">
                      &#9200;&nbsp; {{EXPIRY_NOTE}}
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:20px 32px 0;">
              <p style="margin:0;font-size:13px;color:#6b7280;line-height:1.6;
                         border-top:1px solid #f3f4f6;padding-top:20px;">
                &#128274;&nbsp; {{SECURITY}}
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:28px 32px 32px;">
              <p style="margin:0 0 8px;font-size:12px;color:#9ca3af;line-height:1.5;
                         text-align:center;">
                {{FOOTER}}
              </p>
              <p style="margin:0;font-size:12px;color:#9ca3af;text-align:center;">
                © 2026 Telemaco Limited
                &nbsp;&middot;&nbsp;
                <a href="{{PRIVACY_URL}}"
                   style="color:#9ca3af;text-decoration:underline;">{{PRIVACY}}</a>
                &nbsp;&middot;&nbsp;
                <a href="{{TERMS_URL}}"
                   style="color:#9ca3af;text-decoration:underline;">{{TERMS}}</a>
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
