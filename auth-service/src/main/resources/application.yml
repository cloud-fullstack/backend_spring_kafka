server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: auth-service
  datasource:
    # Cluster: Secret SPRING_DATASOURCE_URL → telemaco_db (users, billing_accounts, login).
    # Default locale solo per sviluppo senza Secret.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/omero_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      # Solo il primario. feaci: script SQL a mano, mai ddl-auto:update.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # OTP e reset: Migadu noreply@. Email programma partner: email_outbox su feaci,
  # solo info@ o support@telemaco.app (Brevo). Non usare SMTP_FROM / noreply@ lì.
  mail:
    host: smtp.migadu.com
    port: 465
    username: noreply@telemaco.app
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true

# PlanAccessService: Caffeine maximumSize 10_000, expireAfterWrite 30s, keyed by JWT uid.
# After payment or suspension, other replicas see the change within 30 seconds (evict() is local to this pod).

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

social:
  google:
    enabled: ${SOCIAL_GOOGLE_ENABLED:false}
    client-id: ${SOCIAL_GOOGLE_CLIENT_ID:}
  facebook:
    enabled: ${SOCIAL_FACEBOOK_ENABLED:false}
    client-id: ${SOCIAL_FACEBOOK_CLIENT_ID:}
    client-secret: ${SOCIAL_FACEBOOK_CLIENT_SECRET:}

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://omero.dev,https://www.omero.dev}

# Redis Streams verso chatbot-services (niente Kafka). Default false: auth-service parte senza Redis.
# Kubernetes (Redis del nodo LLM):
#   OMERO_REDIS_ENABLED=true
#   OMERO_REDIS_HOST=redis-llm.svc.cluster.local
# Restano validi anche REDIS_STREAMS_ENABLED / REDIS_HOST.
omero:
  redis:
    enabled: ${OMERO_REDIS_ENABLED:${REDIS_STREAMS_ENABLED:false}}
    host: ${OMERO_REDIS_HOST:${REDIS_HOST:localhost}}
    port: ${OMERO_REDIS_PORT:${REDIS_PORT:6379}}
    password: ${OMERO_REDIS_PASSWORD:${REDIS_PASSWORD:}}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:https://omero.dev}
  mail-from: ${SMTP_FROM:Telemaco <noreply@telemaco.app>}
  password-reset-ttl-minutes: 30
  registration-otp-ttl-minutes: 10
  support-email: ${SUPPORT_EMAIL:support@telemaco.app}

lemonsqueezy:
  api-key: ${LEMONSQUEEZY_API_KEY:}
  store-id: ${LEMONSQUEEZY_STORE_ID:}
  webhook-secret: ${LEMONSQUEEZY_WEBHOOK_SECRET:}
  customer-portal-url: ${LEMONSQUEEZY_CUSTOMER_PORTAL_URL:}
  test-mode: ${LEMONSQUEEZY_TEST_MODE:true}

channels:
  internal-url: ${CHANNELS_INTERNAL_URL:}
  internal-token: ${CHANNELS_INTERNAL_TOKEN:}

llm:
  entitlements-url: ${LLM_ENTITLEMENTS_URL:}
  entitlements-env: ${BILLING_ENV:}
  internal-token: ${LLM_INTERNAL_TOKEN:}

billing:
  plans-provider: ${BILLING_PLANS_PROVIDER:stripe}
  demo-days: ${DEMO_DAYS:3}

outbox:
  relay:
    delay-ms: ${OUTBOX_RELAY_DELAY_MS:2000}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  test-mode: ${STRIPE_TEST_MODE:true}
  # Header delle chiamate API. I webhook usano la versione dell'endpoint in Dashboard:
  # impostare anche lì 2026-04-22.dahlia (piani, cancellazione a fine periodo, tax code MP).
  api-version: ${STRIPE_API_VERSION:2026-04-22.dahlia}
  credits-tax-code: ${STRIPE_CREDITS_TAX_CODE:txcd_10105002}

# Database feaci (programma Partner). Vuoto = bean assente (sviluppo senza feaci).
# Non c’è flyway-core: niente spring.flyway.* e niente secondo bean Flyway.
# PARTNER_DATASOURCE_URL / USERNAME / PASSWORD: oggi in omero-subscriptions-secrets
# perché /api/reseller passa da omero-omero-subscriptions (anche telemaco.app).
# Dopo lo split PROD: telemaco-subscriptions-secrets.
partner:
  datasource:
    url: ${PARTNER_DATASOURCE_URL:}
    username: ${PARTNER_DATASOURCE_USERNAME:partner_app}
    password: ${PARTNER_DATASOURCE_PASSWORD:}

logging:
  level:
    org.springframework.web.client: WARN
    org.springframework.web.client.RestTemplate: WARN
